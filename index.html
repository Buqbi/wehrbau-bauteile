<meta charset="utf-8">
<title>Grabenbrücke und Wehrschablone</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: nur das Foto, eingepasst in die Fensterhöhe */
:root {
  --c-bruecke: #2b95ff;
  --c-schablone: #ff3f6c;
  --bg: #e9ecef;
  --f-display: "Archivo", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1f1f1f; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #1f1f1f; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; background: var(--bg); }
body {
  margin: 0; display: grid; place-items: center;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  font-family: var(--f-body);
}
.stage {
  position: relative; width: min(100%, calc((100dvh - 24px) * 1.3333));
  max-width: 100%; border-radius: 6px; overflow: hidden; background: #000;
  box-shadow: 0 1px 2px rgba(0,0,0,.15), 0 10px 30px rgba(0,0,0,.18);
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
@supports not (height: 100dvh) { .stage { width: min(100%, calc((100vh - 24px) * 1.3333)); } }
.stage svg { display: block; width: 100%; height: auto; user-select: none; -webkit-user-select: none; }
.dim { fill: #050a10; opacity: 0; transition: opacity .25s ease; pointer-events: none; }
.stage[data-active] .dim { opacity: .5; }
.part .fill { fill-opacity: 0; stroke-opacity: 0; transition: fill-opacity .2s, stroke-opacity .2s; pointer-events: none; stroke-width: 1.6; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.part .glow { opacity: 0; transition: opacity .25s; pointer-events: none; fill: none; stroke-width: 6; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.part .lead { opacity: 0; transition: opacity .2s; pointer-events: none; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.part .hit { fill: transparent; stroke: transparent; cursor: pointer; pointer-events: all; stroke-width: 10; stroke-linejoin: round; }
@media (hover: none), (pointer: coarse) { .part .hit { stroke-width: 22; } }
.part.is-on .fill { fill-opacity: .26; stroke-opacity: 1; }
.part.is-on .glow { opacity: .95; }
.part.is-on .lead { opacity: 1; }
#p-bruecke .fill { fill: var(--c-bruecke); stroke: var(--c-bruecke); }
#p-bruecke .glow, #p-bruecke .lead { stroke: var(--c-bruecke); }
#p-schablone .fill { fill: var(--c-schablone); stroke: var(--c-schablone); }
#p-schablone .glow, #p-schablone .lead { stroke: var(--c-schablone); }

.tag {
  position: absolute; transform: translate(-50%, -100%);
  display: grid; grid-template-columns: auto 1fr; column-gap: 8px; align-items: center;
  padding: 7px 12px 8px 10px; border-radius: 4px;
  background: rgba(9,15,22,.86); color: #fff; white-space: nowrap; pointer-events: none;
  opacity: 0; translate: 0 6px; transition: opacity .2s, translate .2s;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.tag::before { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--c); grid-row: 1; }
.tag b { font: 600 clamp(11px, 1.5vw, 15px)/1.2 var(--f-display); letter-spacing: .01em; }
.tag span { grid-column: 2; font-size: clamp(10px, 1.15vw, 12.5px); line-height: 1.3; color: rgba(255,255,255,.78); }
.tag.below { transform: translate(-50%, 0); }
.tag.is-on { opacity: 1; translate: 0 0; }
#t-bruecke { --c: var(--c-bruecke); left: 45.41%; top: 47.66%; }
#t-schablone { --c: var(--c-schablone); left: 58.59%; top: 70.96%; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>

  var stage = document.getElementById('stage'), dim = document.getElementById('dim');
